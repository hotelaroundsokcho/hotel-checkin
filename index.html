<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>모바일 체크인 — 호텔어라운드 속초</title>
  <style>
      :root {
            --primary: #0A2342;
            --accent: #00B4D8;
            --accent-light: #e0f7fc;
            --success: #22c55e;
            --error: #ef4444;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-700: #374151;
            --gray-900: #111827;
            --radius: 12px;
            --shadow: 0 2px 12px rgba(10,35,66,0.10);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body {
            font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: var(--gray-100);
            color: var(--gray-900);
            min-height: 100vh;
            padding-bottom: 40px;
      }

      .header {
            background: var(--primary);
            color: white;
            padding: 20px 20px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      .header-logo { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; margin-bottom: 4px; }
      .header-title { font-size: 18px; font-weight: 700; }

      .progress-wrap { background: var(--primary); padding: 0 20px 14px; }
      .progress-bar-bg { background: rgba(255,255,255,0.2); border-radius: 99px; height: 4px; overflow: hidden; }
      .progress-bar-fill { background: var(--accent); height: 4px; border-radius: 99px; transition: width 0.4s ease; width: 0%; }
    
  </style></title>
  </head>
